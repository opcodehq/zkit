name: Renderer tests
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renderer-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cmake clang libclang-dev pkg-config libssl-dev
          libfontconfig-dev libfreetype-dev libxcb1-dev libxcb-shape0-dev
          libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
          libwayland-dev libvulkan-dev libasound2-dev
      - name: Clipboard selection and undo regressions
        run: cargo --config .github/clipboard-tests.toml test --locked -p gpui-base --lib paste

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Direct3D WARP pixel and security regressions
        run: cargo test --locked --release -p gpui_windows --lib -- --test-threads=1 --nocapture
      - name: Scene ordering and SVG regressions
        run: |
          cargo test --locked --release -p gpui --lib scene::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --release -p gpui --lib svg_renderer::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build backdrop example
        run: cargo build --locked --release -p gpui --example backdrop_blur
